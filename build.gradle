plugins {
  id 'java'
}

group = 'com.scales.dev'
version = '1.0'

repositories {
  mavenCentral()
}

dependencies {
  // i love lombok
  compileOnly("org.projectlombok:lombok:1.18.48")
  annotationProcessor("org.projectlombok:lombok:1.18.48")
}

jar {
  manifest {
    // java wont run without this!
    attributes('Main-Class': 'com.scales.dev.Main')
  }
}